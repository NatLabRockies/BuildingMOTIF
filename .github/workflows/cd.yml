name: continuous deployment

on:
  push:
    branches:
    - develop
    - main
  release:
    types:
      - published

jobs:

  # deploy docs if not release
  deploy-docs:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      # setup, checkout pull_request.head.ref for repo-vis
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{github.event.pull_request.head.ref}}
      - name: install-uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # # update repo visualization for docs
      # - name: repo-visualizer
      #   uses: githubocto/repo-visualizer@0.8.2
      #   with:
      #     output_file: docs/reference/apidoc/code_visualization.svg
      #     excluded_paths: ".github"
      #     commit_message: "repo-visualizer [skip actions]"
      # install project, which is required for autodoc of code (jupyter-book is in the dev group)
      - name: install buildingmotif
        run: uv sync --all-extras --python 3.11
      # build docs, which are deployed by repo settings
      - name: build docs
        run: |
          uv run jupyter-book config sphinx ./docs/
          uv run sphinx-build ./docs/ docs/_build/html -b html
      # TODO can we use an official GitHub Action? https://github.com/actions/deploy-pages
      - name: deploy docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html

  # deploy distribution if release
  deploy-dist:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # setup
      - name: checkout
        uses: actions/checkout@v4
      - name: install-uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # build dist
      - name: build dist
        run: uv build
      - name: publish distribution to Test PyPI
        id: test-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
          skip_existing: true
      - name: publish distribution to PyPI
        if: steps.test-pypi.outcome == 'success'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # deploy development distribution with changes to develop
  deploy-dev-dist:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install-uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dependencies
        run: uv sync --no-install-project --python 3.11
      - name: increment dev version
        env:
          PYPI_URL: https://pypi.org
        run: uv run python scripts/bump_dev_version.py
      - name: build dist
        run: uv build
      - name: publish dev distribution to Test PyPI
        id: test-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
          skip_existing: true
      - name: publish distribution to PyPI
        if: steps.test-pypi.outcome == 'success'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
