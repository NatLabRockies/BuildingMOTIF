[project]
name = "BuildingMOTIF"
version = "0.4.0"
description = "Building Metadata OnTology Interoperability Framework"
authors = [
    { name = "Hannah Eslinger", email = "Hannah.Eslinger@nrel.gov" },
    { name = "Gabriel Fierro", email = "gtfierro@mines.edu" },
    { name = "Selam Haile", email = "Selam.Haile@nrel.gov" },
    { name = "Avijit Saha", email = "Avijit.Saha@nrel.gov" },
    { name = "Tobias Shapinsky", email = "Tobias.Shapinsky@nrel.gov" },
    { name = "Matthew Steen", email = "Matthew.Steen@nrel.gov" },
]
requires-python = ">=3.11, <3.13"
readme = "docs/README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rdflib>=7.0",
    "SQLAlchemy[mypy]>=1.4.44,<2",
    "pyaml>=21.10.1,<22",
    "networkx>=3.4.2,<4",
    "types-PyYAML>=6.0.4,<7",
    "nbmake>=1.3.0,<2",
    "oxrdflib>=0.5,<0.6",
    "pyshacl>=0.30,<0.31",
    # pyshifty (imported as ``shifty``) is a required dependency: the ``shifty``
    # SHACL engine and the algebraic validation/repair path are always available.
    # Pinned exactly -- the algebra/repair API is not yet stable across minor
    # releases.
    "pyshifty==0.2.5",
    "alembic>=1.8.0,<2",
    "Flask>=2.1.2,<3",
    "Flask-API>=3.0.post1,<4",
    "rfc3987>=1.3.8,<2",
    "setuptools>=73.0.1,<74",
    "pygit2>=1.17,<1.18",
    "jsonschema>=4.21.1,<5",
    "werkzeug>=2.3.7,<3",
    "types-jsonschema>=4.21.0.20240311,<5",
    "matplotlib>=3.9.2,<4",
    "pandas>=2.2.3,<3",
    "ontoenv==0.6.0a5",
]

# NOTE: the ingress packages (BAC0, openpyxl, netifaces, pytz) are ALSO declared in the
# dev dependency group so the test suite has them; they are repeated here with matching
# specifiers so the published extras actually install them. Keep the two in sync.
[project.optional-dependencies]
all = [
    "BAC0>=22.9.21,<23",
    "openpyxl>=3.0.10,<4",
    "netifaces>=0.11.0,<0.12",
    "pytz>=2022.7.1,<2023",
    "psycopg2>=2.9.5,<3",
]
postgres = ["psycopg2>=2.9.5,<3"]
topquadrant = ["brick-tq-shacl==0.3.4a2"]
# dependencies for ingresses (e.g. BAC0, openpyxl) are also included in dev dependencies
bacnet-ingress = ["BAC0>=22.9.21,<23", "netifaces>=0.11.0,<0.12", "pytz>=2022.7.1,<2023"]
xlsx-ingress = ["openpyxl>=3.0.10,<4"]
all-ingresses = [
    "BAC0>=22.9.21,<23",
    "openpyxl>=3.0.10,<4",
    "netifaces>=0.11.0,<0.12",
    "pytz>=2022.7.1,<2023",
]

[project.urls]
Repository = "https://github.com/NREL/BuildingMOTIF"
Documentation = "https://buildingmotif.readthedocs.io/"

[project.scripts]
buildingmotif = "buildingmotif.bin.cli:app"

[dependency-groups]
dev = [
    "black>=22.3.0,<23",
    "isort>=5.10.1,<6",
    "pre-commit>=2.17.0,<3",
    "pytest-cov>=3.0.0,<4",
    "mypy==1.9.0",
    "sqlalchemy2-stubs>=0.0.2a38,<0.0.3",
    "psycopg2-binary>=2.9.5,<3",
    "jupytext>=1.13.8,<2",
    "jupyter>=1.0.0,<2",
    "ipykernel>=6.13.0,<7",
    "rise>=5.7.1,<6",
    "jupyter-book>=0.15.1,<0.16",
    "flake8>=7.0.0,<8",
    "BAC0>=22.9.21,<23",
    "netifaces>=0.11.0,<0.12",
    "pytz>=2022.7.1,<2023",
    "openpyxl>=3.0.10,<4",
    "pytest>=8.0.2,<9",
    "tomlkit>=0.13.2,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buildingmotif"]

[tool.hatch.build.targets.sdist]
include = ["buildingmotif", "migrations", "docs/README.md", "LICENSE"]

[tool.black]
extend-exclude = "docs/conf.py"

[tool.isort]
profile = "black"

[tool.mypy]
files = ["buildingmotif/*.py", "tests/*.py", "migrations/*.py"]
plugins = "sqlalchemy.ext.mypy.plugin"
follow_imports = "skip"

[tool.pytest.ini_options]
log_cli_level = "WARNING"
markers = [
    "integration: mark a test as an integration test"
]
